<title>Catálogo de Ejercicios</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground:#050505; --surface:#111113; --surface-2:#17171a; --border:#27272a;
    --text:#fafafa; --muted:#a1a1aa; --faint:#71717a;
    --accent:#eab308; --accent-dim:rgba(234,179,8,.14);
    --ok:#22c55e; --ok-dim:rgba(34,197,94,.13);
    --warn:#f97316; --warn-dim:rgba(249,115,22,.13);
    --danger:#ef4444; --danger-dim:rgba(239,68,68,.12);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --ground:#faf9f7; --surface:#fff; --surface-2:#f4f3f0; --border:#e0ddd6;
      --text:#1a1917; --muted:#5c584f; --faint:#8a857a;
      --accent:#8a6d00; --accent-dim:rgba(138,109,0,.10);
      --ok:#15803d; --ok-dim:rgba(21,128,61,.10);
      --warn:#b45309; --warn-dim:rgba(180,83,9,.10);
      --danger:#b91c1c; --danger-dim:rgba(185,28,28,.08);
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --ground:#faf9f7; --surface:#fff; --surface-2:#f4f3f0; --border:#e0ddd6;
    --text:#1a1917; --muted:#5c584f; --faint:#8a857a;
    --accent:#8a6d00; --accent-dim:rgba(138,109,0,.10);
    --ok:#15803d; --ok-dim:rgba(21,128,61,.10);
    --warn:#b45309; --warn-dim:rgba(180,83,9,.10);
    --danger:#b91c1c; --danger-dim:rgba(185,28,28,.08);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--ground); color: var(--text); margin: 0;
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding-inline: 20px; padding-block: 0 80px;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }

  header { padding-block: 40px 22px; }
  .eyebrow { font-family:Oswald,sans-serif; font-size:12px; font-weight:600; letter-spacing:.18em;
             text-transform:uppercase; color:var(--accent); margin:0 0 10px; }
  h1 { font-family:Oswald,sans-serif; font-weight:700; font-size:clamp(28px,6vw,40px);
       line-height:1.05; margin:0 0 12px; letter-spacing:-.01em; text-wrap:balance; }
  .lede { color:var(--muted); max-width:62ch; margin:0; }

  /* resumen por grupo */
  .resumen { width:100%; border-collapse:collapse; margin-block:24px;
             font-variant-numeric:tabular-nums; font-size:14px; }
  .resumen th { font-family:Oswald,sans-serif; font-size:11px; font-weight:600; letter-spacing:.1em;
                text-transform:uppercase; color:var(--faint); text-align:right; padding:8px 10px;
                border-bottom:1px solid var(--border); white-space:nowrap; }
  .resumen th:first-child, .resumen td:first-child { text-align:left; }
  .resumen td { padding:7px 10px; text-align:right; border-bottom:1px solid var(--border); }
  .resumen tbody tr { cursor:pointer; }
  .resumen tbody tr:hover td { background:var(--surface); }
  .resumen tr.sel td { background:var(--accent-dim); }
  .gname { font-family:Oswald,sans-serif; font-weight:500; font-size:15px; }
  .bar { display:inline-block; height:4px; border-radius:2px; background:var(--accent); vertical-align:middle; }
  .pct { color:var(--faint); font-size:12px; margin-left:6px; }
  .lack { color:var(--danger); font-weight:600; }

  /* controles */
  .controls { position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
              background:var(--ground); padding-block:12px; border-bottom:1px solid var(--border); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input[type=search] {
    flex:1 1 220px; min-width:0; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; color:var(--text); padding:9px 12px; font-size:15px; font-family:inherit;
  }
  .chip { font-family:Oswald,sans-serif; font-size:12px; font-weight:500; letter-spacing:.05em;
          text-transform:uppercase; padding:6px 11px; border-radius:999px; cursor:pointer;
          border:1px solid var(--border); background:var(--surface); color:var(--muted); }
  .chip[aria-pressed="true"] { background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }
  .count { font-size:13px; color:var(--faint); margin-left:auto; font-variant-numeric:tabular-nums; }

  /* listado */
  h2 { font-family:Oswald,sans-serif; font-weight:600; font-size:13px; letter-spacing:.16em;
       text-transform:uppercase; color:var(--accent); margin:30px 0 10px; }
  h2 small { color:var(--faint); font-weight:400; letter-spacing:.04em; margin-left:8px; }
  ul.lista { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; }
  li.ej { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
          background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:8px 12px; }
  li.ej.nosmart { background:none; }
  .id { font-family:"JetBrains Mono",monospace; font-size:11.5px; color:var(--faint);
        font-variant-numeric:tabular-nums; min-width:42px; }
  .nm { flex:1 1 200px; min-width:0; }
  .flags { display:flex; gap:5px; flex-wrap:wrap; }
  .f { font-size:10.5px; font-family:Oswald,sans-serif; font-weight:500; letter-spacing:.06em;
       text-transform:uppercase; padding:2px 7px; border-radius:999px; white-space:nowrap;
       border:1px solid var(--border); color:var(--faint); }
  .f.smart { background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }
  .f.noimg { background:var(--danger-dim); border-color:var(--danger); color:var(--danger); }
  .f.usos  { background:var(--ok-dim); border-color:var(--ok); color:var(--ok); }
  .f.roto  { background:var(--warn-dim); border-color:var(--warn); color:var(--warn); }
  .f.pat   { font-family:"JetBrains Mono",monospace; text-transform:none; letter-spacing:0; font-size:10px; }
  .vacio { color:var(--faint); padding:24px 0; text-align:center; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Total Gym · 8 oct 2026</p>
    <h1>Catálogo de ejercicios activos</h1>
    <p class="lede">
      Los 692 ejercicios que un usuario puede encontrar hoy navegando por grupo muscular.
      Toca una fila del resumen para filtrar, o usa los filtros para aislar lo que falta.
    </p>
  </header>

  <table class="resumen">
    <thead>
      <tr>
        <th>Grupo</th><th>Activos</th><th>Smart</th><th>Con imagen</th><th>Clasificados</th><th>Usados</th>
      </tr>
    </thead>
    <tbody id="resumen"></tbody>
  </table>

  <div class="controls">
    <div class="row">
      <input type="search" id="q" placeholder="Buscar por nombre o id…" autocomplete="off">
      <button class="chip" id="f-noimg"  aria-pressed="false">Sin imagen</button>
      <button class="chip" id="f-smart"  aria-pressed="false">Solo Smart</button>
      <button class="chip" id="f-nouso"  aria-pressed="false">Nunca usados</button>
      <button class="chip" id="f-roto"   aria-pressed="false">Nombre sospechoso</button>
      <span class="count" id="count"></span>
    </div>
  </div>

  <div id="lista"></div>
</div>

// Un nombre "sospechoso": inglés sin traducir, marca comercial o orden de palabras roto.
const ROTO = /\b(db|press ?ups?|grip|raises|rows|wise|exercise|flye?|machine|seated|standing|legend|hammerstrength|inverted|width|knee|underhand|straight|tuck|over|side|down|up|ups)\b/i;

const GRUPOS = [...new Set(DATA.map(e => e.g))]
  .sort((a, b) => DATA.filter(e => e.g === b).length - DATA.filter(e => e.g === a).length);

const state = { grupo: null, q: '', noimg: false, smart: false, nouso: false, roto: false };

/* ---------- resumen ---------- */
const rt = document.getElementById('resumen');
GRUPOS.forEach(g => {
  const l = DATA.filter(e => e.g === g);
  const img = l.filter(e => e.img).length;
  const tr = document.createElement('tr');
  tr.dataset.grupo = g;
  const pct = Math.round(img / l.length * 100);
  tr.innerHTML =
    `<td class="gname">${g}</td>` +
    `<td>${l.length}</td>` +
    `<td>${l.filter(e => e.smart).length}</td>` +
    `<td><span class="bar" style="width:${Math.max(2, pct * .5)}px"></span>` +
      `<span class="${pct < 40 ? 'lack' : ''}" style="margin-left:7px">${img}</span>` +
      `<span class="pct">${pct}%</span></td>` +
    `<td>${l.filter(e => e.pat).length}</td>` +
    `<td>${l.filter(e => e.usos > 0).length}</td>`;
  tr.addEventListener('click', () => {
    state.grupo = state.grupo === g ? null : g;
    [...rt.children].forEach(r => r.classList.toggle('sel', r.dataset.grupo === state.grupo));
    render();
  });
  rt.append(tr);
});

/* ---------- filtros ---------- */
const q = document.getElementById('q');
q.addEventListener('input', () => { state.q = q.value.trim().toLowerCase(); render(); });
[['f-noimg','noimg'],['f-smart','smart'],['f-nouso','nouso'],['f-roto','roto']].forEach(([id, key]) => {
  const b = document.getElementById(id);
  b.addEventListener('click', () => {
    state[key] = !state[key];
    b.setAttribute('aria-pressed', String(state[key]));
    render();
  });
});

/* ---------- listado ---------- */
const lista = document.getElementById('lista');
const countEl = document.getElementById('count');

function pasa(e) {
  if (state.grupo && e.g !== state.grupo) return false;
  if (state.noimg && e.img) return false;
  if (state.smart && !e.smart) return false;
  if (state.nouso && e.usos > 0) return false;
  if (state.roto && !ROTO.test(e.n)) return false;
  if (state.q && !(e.n.toLowerCase().includes(state.q) || String(e.id) === state.q)) return false;
  return true;
}

function render() {
  const vis = DATA.filter(pasa);
  countEl.textContent = `${vis.length} de ${DATA.length}`;
  lista.textContent = '';
  if (!vis.length) {
    const p = document.createElement('p');
    p.className = 'vacio';
    p.textContent = 'Nada coincide con esos filtros.';
    lista.append(p);
    return;
  }
  for (const g of GRUPOS) {
    const l = vis.filter(e => e.g === g);
    if (!l.length) continue;
    const h = document.createElement('h2');
    const sinImg = l.filter(e => !e.img).length;
    h.innerHTML = `${g} <small>${l.length}${sinImg ? ` · ${sinImg} sin imagen` : ''}</small>`;
    lista.append(h);
    const ul = document.createElement('ul');
    ul.className = 'lista';
    l.sort((a, b) => (b.smart - a.smart) || (b.usos - a.usos) || a.n.localeCompare(b.n, 'es'));
    for (const e of l) {
      const li = document.createElement('li');
      li.className = 'ej' + (e.smart ? '' : ' nosmart');
      const flags = [];
      if (e.smart) flags.push('<span class="f smart">smart</span>');
      if (!e.img) flags.push('<span class="f noimg">sin imagen</span>');
      if (e.usos) flags.push(`<span class="f usos">${e.usos} series</span>`);
      if (ROTO.test(e.n)) flags.push('<span class="f roto">nombre</span>');
      if (e.pat) flags.push(`<span class="f pat">${e.pat}</span>`);
      if (e.eq) flags.push(`<span class="f">${e.eq}</span>`);
      li.innerHTML = `<span class="id">#${e.id}</span><span class="nm">${e.n}</span>` +
                     `<span class="flags">${flags.join('')}</span>`;
      ul.append(li);
    }
    lista.append(ul);
  }
}
render();
</script>
